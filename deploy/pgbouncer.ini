; PgBouncer in front of Postgres, transaction pooling. Used by docker-compose.yml;
; loadtest/scaleout.sh rewrites host and listen_addr in a temp copy.
; The user list example is deploy/userlist.example.txt (dev defaults). In Compose the real
; file is generated at start from POSTGRES_USER / POSTGRES_PASSWORD.
[databases]
* = host=postgres port=5432 connect_query='SET statement_timeout = 5000'

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/userlist.txt
; No admin_users / stats_users: the app user cannot open the admin console (the "pgbouncer"
; database). loadtest/scaleout.sh appends its own admin user, local temp config only.

; Transaction pooling: a server connection is held only for the length of a transaction.
; No session state survives between statements: no session advisory locks, LISTEN, SET without
; LOCAL, WITH HOLD cursors. Migrations use MIGRATE_DATABASE_URL (direct to Postgres).
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
; Named prepared statements are tracked by PgBouncer (1.21+); pg's unnamed ones work regardless.
max_prepared_statements = 100
; pg sends statement_timeout as a startup parameter (see src/db/pool.ts); PgBouncer rejects
; unknown startup parameters unless ignored, and the ignored value is dropped. connect_query in
; [databases] re-applies the same 5 s cap on every new server connection instead.
ignore_startup_parameters = statement_timeout

server_idle_timeout = 600
query_wait_timeout = 10
log_connections = 0
log_disconnections = 0
