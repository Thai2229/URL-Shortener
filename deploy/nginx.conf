# Edge proxy for the API replicas. Used by docker-compose.yml as
# /etc/nginx/nginx.conf, and by loadtest/scaleout.sh, which rewrites the
# upstream block and listen port in a temp copy.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  server_tokens off;
  # Buffered; set "access_log off;" to drop it entirely. Per-request logs are in the app.
  access_log /dev/stdout combined buffer=32k flush=5s;

  # Private ranges (loopback, RFC1918, ULA): the only clients that may reach /metrics and /readyz.
  geo $internal_client {
    default        0;
    127.0.0.0/8    1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    ::1            1;
    fc00::/7       1;
  }

  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  upstream api {
    # In Compose "api" resolves to every replica; nginx resolves it at startup only.
    server api:3000;
    keepalive 64;
  }

  server {
    listen 80;
    client_max_body_size 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite, never $proxy_add_x_forwarded_for: the app runs with TRUST_PROXY=1 and trusts this value.
    proxy_set_header X-Forwarded-For $remote_addr;
    # Reuse a client request id when sent (the app validates it), else use nginx's.
    proxy_set_header X-Request-Id $req_id;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    # Retry only connection failures/timeouts, and never non-idempotent methods (nginx's default).
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 5s;

    location ~ ^/(metrics|readyz)$ {
      if ($internal_client = 0) {
        return 404;
      }
      proxy_pass http://api;
    }

    location / {
      proxy_pass http://api;
    }
  }
}
